<div class="row my-4" >
	<div class="col-md-8">
		<label id="problema" for="{{form.problema.id_for_label}}" class="form-label">{{form.problema.label}}</label>
		{{form.problema}}
		<div id="problema_feedback">{{form.problema.errors}}</div>
	</div>
	<div class="col-md-4">
		<label for="{{form.link.id_for_label}}" class="form-label">{{form.link.label}}</label>
		{{form.link}}
		<div id="link_feedback">{{form.link.errors}}</div>
		<p>{{form.link.help_text}}</p>
	</div>
</div>
