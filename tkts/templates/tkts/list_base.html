{% extends 'tkts/base.html' %}

{% load static %}
{% block head %}
    <script src={% static 'js/list.js' %} type='application/javascript'></script>
    {{fields|json_script:"fields-data"}}
    {% block list_head %}
    {% endblock list_head %}
{% endblock %}

{% block body %}
<div class="container-fluid">
    <div class="row justify-content-between p-2">
        <div class="col-auto p-1 mx-2" id="filtrosButtons">
        </div>
        <div class="col p-1">
            <div class="row" id='filtros'>
            </div>
        </div>
        <div class="col-auto p-1 mx-2">
            <div class="mx-1 row justify-content-end">
                <div class="col-auto px-1">
                    <div class="{% if not is_map %}border border-secondary rounded-1 {% endif %} py-1 px-2">
                        <a id="lista" {% if is_map %} onclick='goToList()' {% endif %}><i class="bi bi-list-ul"></i></a>
                    </div>
                </div>
                <div class="col-auto px-1">
                    <div class="{% if is_map %}border border-secondary rounded-1 {% endif %}py-1 px-2">
                        <a id="mapa"  {% if not is_map %} onclick='goToMap()' {% endif %}><i class="bi bi-map"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% block map %}
{% endblock map %}
<div class="container-xl" style="overflow-x: auto !important;">
    {% block list %}
    {% endblock list %}
</div>
{% endblock body %}
