services:
  - type: web
    plan: free
    name: tickets
    runtime: python
    buildCommand: "bash ./build.sh"
    startCommand: "python -m gunicorn tickets.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: tickets.settings.demo
      - key: SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
